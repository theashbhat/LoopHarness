<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  background: linear-gradient(160deg, #0a0a1a 0%, #1a1a3e 50%, #0d0d2b 100%);
  color: #ffffff;
}

.scene {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 80px 60px;
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.6s ease, transform 0.6s ease;
  pointer-events: none;
}
.scene.active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

/* Scene 1: Title */
.scene-title .emoji-hero {
  font-size: 160px;
  margin-bottom: 40px;
  animation: bounce 2s ease infinite;
}
.scene-title h1 {
  font-size: 72px;
  font-weight: 800;
  letter-spacing: -2px;
  text-align: center;
  margin-bottom: 24px;
}
.scene-title .subtitle {
  font-size: 36px;
  color: rgba(255,255,255,0.6);
  text-align: center;
}

/* Scene 2: Stats */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  width: 100%;
  max-width: 900px;
}
.stat-card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 32px;
  padding: 48px 36px;
  text-align: center;
  opacity: 0;
  transform: scale(0.8);
  animation: popIn 0.5s ease forwards;
}
.stat-card:nth-child(1) { animation-delay: 0.1s; }
.stat-card:nth-child(2) { animation-delay: 0.2s; }
.stat-card:nth-child(3) { animation-delay: 0.3s; }
.stat-card:nth-child(4) { animation-delay: 0.4s; }
.stat-card .stat-emoji { font-size: 56px; margin-bottom: 16px; }
.stat-card .stat-value {
  font-size: 64px;
  font-weight: 800;
  background: linear-gradient(135deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.stat-card .stat-label {
  font-size: 28px;
  color: rgba(255,255,255,0.5);
  margin-top: 8px;
}

/* Scene 3: Progress */
.progress-section {
  width: 100%;
  max-width: 900px;
}
.progress-section h2 {
  font-size: 48px;
  font-weight: 700;
  margin-bottom: 48px;
  text-align: center;
}
.progress-item {
  margin-bottom: 40px;
  opacity: 0;
  transform: translateX(-30px);
  animation: slideIn 0.5s ease forwards;
}
.progress-item:nth-child(2) { animation-delay: 0.2s; }
.progress-item:nth-child(3) { animation-delay: 0.4s; }
.progress-item:nth-child(4) { animation-delay: 0.6s; }
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 32px;
  margin-bottom: 16px;
}
.progress-bar {
  height: 24px;
  background: rgba(255,255,255,0.1);
  border-radius: 12px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 12px;
  background: linear-gradient(90deg, #60a5fa, #a78bfa);
  width: 0%;
  animation: fillBar 1s ease forwards;
  animation-delay: 0.3s;
}

/* Scene 4: Highlights */
.highlights-list {
  width: 100%;
  max-width: 900px;
}
.highlights-list h2 {
  font-size: 48px;
  font-weight: 700;
  margin-bottom: 48px;
  text-align: center;
}
.highlight-item {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 32px;
  background: rgba(255,255,255,0.05);
  border-radius: 24px;
  margin-bottom: 20px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.4s ease forwards;
}
.highlight-item:nth-child(2) { animation-delay: 0.15s; }
.highlight-item:nth-child(3) { animation-delay: 0.3s; }
.highlight-item:nth-child(4) { animation-delay: 0.45s; }
.highlight-item:nth-child(5) { animation-delay: 0.6s; }
.highlight-emoji { font-size: 48px; }
.highlight-text { font-size: 32px; line-height: 1.4; }

/* Keyframes */
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}
@keyframes popIn {
  to { opacity: 1; transform: scale(1); }
}
@keyframes slideIn {
  to { opacity: 1; transform: translateX(0); }
}
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fillBar {
  to { width: var(--fill); }
}

/* Progress dots */
.progress-dots {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 16px;
}
.dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transition: background 0.3s, transform 0.3s;
}
.dot.active {
  background: #60a5fa;
  transform: scale(1.3);
}
</style>
</head>
<body>

<!-- Scene 1: Title -->
<div class="scene scene-title active" data-scene="0">
  <div class="emoji-hero" id="heroEmoji">📊</div>
  <h1 id="titleText">Daily Recap</h1>
  <div class="subtitle" id="subtitleText">Here's your day at a glance</div>
</div>

<!-- Scene 2: Stats Grid -->
<div class="scene" data-scene="1">
  <div class="stat-grid" id="statGrid"></div>
</div>

<!-- Scene 3: Progress Bars -->
<div class="scene" data-scene="2">
  <div class="progress-section">
    <h2>Goals Progress</h2>
    <div id="progressItems"></div>
  </div>
</div>

<!-- Scene 4: Highlights -->
<div class="scene" data-scene="3">
  <div class="highlights-list">
    <h2>✨ Highlights</h2>
    <div id="highlightsList"></div>
  </div>
</div>

<!-- Navigation dots -->
<div class="progress-dots" id="dots"></div>

<script>
// Template: DailyRecap
// Expects JSON payload with: title, subtitle, emoji, stats[], goals[], highlights[]
(function() {
  let currentScene = 0;
  const scenes = document.querySelectorAll('.scene');
  const totalScenes = scenes.length;

  function init(data) {
    // Title scene
    if (data.emoji) document.getElementById('heroEmoji').textContent = data.emoji;
    if (data.title) document.getElementById('titleText').textContent = data.title;
    if (data.subtitle) document.getElementById('subtitleText').textContent = data.subtitle;

    // Stats grid
    const grid = document.getElementById('statGrid');
    (data.stats || []).forEach(function(s) {
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = '<div class="stat-emoji">' + (s.emoji || '📈') + '</div>' +
        '<div class="stat-value">' + s.value + '</div>' +
        '<div class="stat-label">' + s.label + '</div>';
      grid.appendChild(card);
    });

    // Progress bars
    const progressContainer = document.getElementById('progressItems');
    (data.goals || []).forEach(function(g) {
      const item = document.createElement('div');
      item.className = 'progress-item';
      const pct = Math.min(100, Math.round((g.current / g.target) * 100));
      item.innerHTML = '<div class="progress-label"><span>' + g.label + '</span><span>' + pct + '%</span></div>' +
        '<div class="progress-bar"><div class="progress-fill" style="--fill:' + pct + '%"></div></div>';
      progressContainer.appendChild(item);
    });

    // Highlights
    const list = document.getElementById('highlightsList');
    (data.highlights || []).forEach(function(h) {
      const item = document.createElement('div');
      item.className = 'highlight-item';
      item.innerHTML = '<div class="highlight-emoji">' + (h.emoji || '⭐') + '</div>' +
        '<div class="highlight-text">' + h.text + '</div>';
      list.appendChild(item);
    });

    // Dots
    const dotsEl = document.getElementById('dots');
    for (let i = 0; i < totalScenes; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dotsEl.appendChild(dot);
    }
  }

  function goToScene(index) {
    if (index < 0 || index >= totalScenes) return;
    scenes[currentScene].classList.remove('active');
    currentScene = index;
    scenes[currentScene].classList.add('active');
    // Update dots
    document.querySelectorAll('.dot').forEach(function(d, i) {
      d.classList.toggle('active', i === currentScene);
    });
  }

  function advance() {
    if (currentScene < totalScenes - 1) goToScene(currentScene + 1);
  }

  function retreat() {
    if (currentScene > 0) goToScene(currentScene - 1);
  }

  // Tap zones: left 30% = back, right 70% = forward
  document.addEventListener('click', function(e) {
    if (e.clientX < 1080 * 0.3) retreat();
    else advance();
  });

  // Auto-advance timeline (4s per scene)
  let autoTimer = null;
  function startAutoPlay() {
    autoTimer = setInterval(function() {
      if (currentScene < totalScenes - 1) advance();
      else clearInterval(autoTimer);
    }, 4000);
  }

  // Exposed for native bridge
  window.StoryBridge = {
    init: init,
    advance: advance,
    retreat: retreat,
    goToScene: goToScene,
    startAutoPlay: startAutoPlay,
    stopAutoPlay: function() { if (autoTimer) clearInterval(autoTimer); },
    getCurrentScene: function() { return currentScene; },
    getTotalScenes: function() { return totalScenes; }
  };

  // If data is embedded in the page (for standalone viewing)
  if (window.__STORY_DATA__) {
    init(window.__STORY_DATA__);
    startAutoPlay();
  }
})();
</script>
</body>
</html>
