<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  background: linear-gradient(160deg, #0d1b0e 0%, #1a3d1f 50%, #0a2a0d 100%);
  color: #ffffff;
}

.scene {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 80px 60px;
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.6s ease, transform 0.6s ease;
  pointer-events: none;
}
.scene.active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

/* Scene 1: Hero */
.hero-icon {
  font-size: 180px;
  margin-bottom: 32px;
  animation: pulse 2s ease infinite;
}
.hero-title {
  font-size: 80px;
  font-weight: 800;
  letter-spacing: -3px;
  text-align: center;
  background: linear-gradient(135deg, #4ade80, #22d3ee);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 16px;
}
.hero-subtitle {
  font-size: 36px;
  color: rgba(255,255,255,0.6);
  text-align: center;
}

/* Scene 2: Key metrics (big numbers) */
.metric-stack {
  width: 100%;
  max-width: 900px;
}
.metric-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 36px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  opacity: 0;
  animation: fadeIn 0.4s ease forwards;
}
.metric-row:nth-child(1) { animation-delay: 0.1s; }
.metric-row:nth-child(2) { animation-delay: 0.25s; }
.metric-row:nth-child(3) { animation-delay: 0.4s; }
.metric-row:nth-child(4) { animation-delay: 0.55s; }
.metric-row:last-child { border-bottom: none; }
.metric-left {
  display: flex;
  align-items: center;
  gap: 20px;
}
.metric-emoji { font-size: 48px; }
.metric-label { font-size: 34px; color: rgba(255,255,255,0.7); }
.metric-value {
  font-size: 52px;
  font-weight: 700;
  color: #4ade80;
}
.metric-unit {
  font-size: 28px;
  color: rgba(255,255,255,0.4);
  margin-left: 8px;
}

/* Scene 3: Ring chart */
.ring-container {
  position: relative;
  width: 500px;
  height: 500px;
  margin-bottom: 48px;
}
.ring-svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.ring-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 40; }
.ring-fill {
  fill: none;
  stroke-width: 40;
  stroke-linecap: round;
  stroke-dasharray: 1256;
  stroke-dashoffset: 1256;
  animation: ringDraw 1.5s ease forwards;
  animation-delay: 0.3s;
}
.ring-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.ring-pct {
  font-size: 96px;
  font-weight: 800;
  color: #4ade80;
}
.ring-label {
  font-size: 32px;
  color: rgba(255,255,255,0.5);
}
.ring-caption {
  font-size: 34px;
  color: rgba(255,255,255,0.7);
  text-align: center;
  max-width: 700px;
}

/* Scene 4: Timeline */
.timeline {
  width: 100%;
  max-width: 900px;
}
.timeline h2 {
  font-size: 48px;
  font-weight: 700;
  margin-bottom: 48px;
  text-align: center;
}
.timeline-item {
  display: flex;
  gap: 24px;
  margin-bottom: 32px;
  opacity: 0;
  animation: slideUp 0.4s ease forwards;
}
.timeline-item:nth-child(2) { animation-delay: 0.1s; }
.timeline-item:nth-child(3) { animation-delay: 0.2s; }
.timeline-item:nth-child(4) { animation-delay: 0.3s; }
.timeline-item:nth-child(5) { animation-delay: 0.4s; }
.timeline-item:nth-child(6) { animation-delay: 0.5s; }
.timeline-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #4ade80;
  margin-top: 8px;
  flex-shrink: 0;
}
.timeline-content {}
.timeline-time {
  font-size: 26px;
  color: rgba(255,255,255,0.4);
  margin-bottom: 4px;
}
.timeline-text {
  font-size: 32px;
  line-height: 1.4;
}

/* Keyframes */
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes fadeIn {
  to { opacity: 1; }
}
@keyframes slideUp {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ringDraw {
  to { stroke-dashoffset: var(--ring-offset); }
}

/* Progress dots */
.progress-dots {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 16px;
}
.dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transition: background 0.3s, transform 0.3s;
}
.dot.active {
  background: #4ade80;
  transform: scale(1.3);
}
</style>
</head>
<body>

<!-- Scene 1: Hero -->
<div class="scene active" data-scene="0">
  <div class="hero-icon" id="heroIcon">🏃‍♂️</div>
  <div class="hero-title" id="heroTitle">Activity</div>
  <div class="hero-subtitle" id="heroSubtitle">Your workout summary</div>
</div>

<!-- Scene 2: Key Metrics -->
<div class="scene" data-scene="1">
  <div class="metric-stack" id="metricStack"></div>
</div>

<!-- Scene 3: Ring/Goal -->
<div class="scene" data-scene="2">
  <div class="ring-container">
    <svg class="ring-svg" viewBox="0 0 440 440">
      <circle class="ring-bg" cx="220" cy="220" r="200"/>
      <circle class="ring-fill" id="ringFill" cx="220" cy="220" r="200"/>
    </svg>
    <div class="ring-center">
      <div class="ring-pct" id="ringPct">0%</div>
      <div class="ring-label" id="ringLabel">of goal</div>
    </div>
  </div>
  <div class="ring-caption" id="ringCaption"></div>
</div>

<!-- Scene 4: Timeline -->
<div class="scene" data-scene="3">
  <div class="timeline">
    <h2>🕐 Timeline</h2>
    <div id="timelineList"></div>
  </div>
</div>

<!-- Navigation dots -->
<div class="progress-dots" id="dots"></div>

<script>
// Template: ActivitySummary
// Expects: { title, subtitle, icon, metrics[], goal: { current, target, label, caption }, timeline[] }
(function() {
  let currentScene = 0;
  const scenes = document.querySelectorAll('.scene');
  const totalScenes = scenes.length;

  function init(data) {
    if (data.icon) document.getElementById('heroIcon').textContent = data.icon;
    if (data.title) document.getElementById('heroTitle').textContent = data.title;
    if (data.subtitle) document.getElementById('heroSubtitle').textContent = data.subtitle;

    // Metrics
    const stack = document.getElementById('metricStack');
    (data.metrics || []).forEach(function(m) {
      const row = document.createElement('div');
      row.className = 'metric-row';
      row.innerHTML = '<div class="metric-left"><span class="metric-emoji">' + (m.emoji || '📊') + '</span>' +
        '<span class="metric-label">' + m.label + '</span></div>' +
        '<div><span class="metric-value">' + m.value + '</span>' +
        (m.unit ? '<span class="metric-unit">' + m.unit + '</span>' : '') + '</div>';
      stack.appendChild(row);
    });

    // Ring
    if (data.goal) {
      const pct = Math.min(100, Math.round((data.goal.current / data.goal.target) * 100));
      const circumference = 2 * Math.PI * 200; // ~1256
      const offset = circumference - (circumference * pct / 100);
      const ring = document.getElementById('ringFill');
      ring.style.setProperty('--ring-offset', offset);
      ring.style.stroke = pct >= 100 ? '#4ade80' : '#22d3ee';
      document.getElementById('ringPct').textContent = pct + '%';
      if (data.goal.label) document.getElementById('ringLabel').textContent = data.goal.label;
      if (data.goal.caption) document.getElementById('ringCaption').textContent = data.goal.caption;
    }

    // Timeline
    const list = document.getElementById('timelineList');
    (data.timeline || []).forEach(function(t) {
      const item = document.createElement('div');
      item.className = 'timeline-item';
      item.innerHTML = '<div class="timeline-dot"></div><div class="timeline-content">' +
        '<div class="timeline-time">' + (t.time || '') + '</div>' +
        '<div class="timeline-text">' + t.text + '</div></div>';
      list.appendChild(item);
    });

    // Dots
    const dotsEl = document.getElementById('dots');
    for (let i = 0; i < totalScenes; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dotsEl.appendChild(dot);
    }
  }

  function goToScene(index) {
    if (index < 0 || index >= totalScenes) return;
    scenes[currentScene].classList.remove('active');
    currentScene = index;
    scenes[currentScene].classList.add('active');
    document.querySelectorAll('.dot').forEach(function(d, i) {
      d.classList.toggle('active', i === currentScene);
    });
  }

  function advance() { if (currentScene < totalScenes - 1) goToScene(currentScene + 1); }
  function retreat() { if (currentScene > 0) goToScene(currentScene - 1); }

  document.addEventListener('click', function(e) {
    if (e.clientX < 1080 * 0.3) retreat();
    else advance();
  });

  let autoTimer = null;
  function startAutoPlay() {
    autoTimer = setInterval(function() {
      if (currentScene < totalScenes - 1) advance();
      else clearInterval(autoTimer);
    }, 4000);
  }

  window.StoryBridge = {
    init: init,
    advance: advance,
    retreat: retreat,
    goToScene: goToScene,
    startAutoPlay: startAutoPlay,
    stopAutoPlay: function() { if (autoTimer) clearInterval(autoTimer); },
    getCurrentScene: function() { return currentScene; },
    getTotalScenes: function() { return totalScenes; }
  };

  if (window.__STORY_DATA__) {
    init(window.__STORY_DATA__);
    startAutoPlay();
  }
})();
</script>
</body>
</html>
